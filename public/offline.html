<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Cocina en Casa</title>
    <style>
      :root { --bg: #f7f3ec; --ink: #1f1d1a; --muted: #7a746b; --accent: #557a5a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121110; --ink: #f3efe9; --muted: #a39d93; --accent: #8db892; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.45; }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
        border-radius: 999px; padding: 12px 24px; }
      .link { display: block; margin-top: 18px; color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Esta página aún no está guardada en el móvil.<br />Vuelve a intentarlo cuando tengas red.</p>
      <button onclick="location.reload()">Reintentar</button>
      <!-- La lista de la compra funciona sin conexión (si se abrió alguna vez) -->
      <a class="link" href="/compra">Ir a la lista de la compra</a>
    </main>
  </body>
</html>
